<!DOCTYPE html>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<html lang="en">

<head>
    <title>Three.js simulation</title>
    <style>
        body {
            font-family: verdana;
            font-size: 15px;
        }

        .button {
            background-color: #606060;
            border: none;
            color: white;
            padding: 10px 15px;
            font-size: 12px;
            margin: 4px 2px;
            cursor: pointer;
        }

        #cameraControls {
            margin: 10px 0;
            padding: 10px;
            border: 1px solid #ccc;
            background-color: #f5f5f5;
            border-radius: 4px;
        }
        
        #cameraControls div {
            margin: 5px 0;
        }
        
        #cameraControls h4 {
            margin: 0 0 10px 0;
        }
        
        #cameraInfo {
            background-color: #fff;
            padding: 5px;
            border-radius: 3px;
        }
    </style>
</head>

<body>
    <!-- 
    <h1>Three.js simulation</h1>
    <h3>Hold Ctrl to move camera</h3> -->
    <button onclick="reload()" class="button">Reload</button>
    <select id="simulationSelector" onchange="simulationSelected(this.selectedIndex)" class="button"></select>
    <button id="buttonRun" onclick="run()" class="button"></button>
    <button onclick="toggleNodes()" class="button">Toggle nodes</button>
    <input type="checkbox" onclick="toggleHiglightNodes()"> Highlight self-colliding nodes
    <input id="showDenseCheckbox" type="checkbox" onclick="onShowDense()"> Show dense
    <input id="showReducedCheckbox" type="checkbox" onclick="onShowReduced()"> Show reduced
    <label for="animationSkipInput">Animation Skip:</label>
    <input id="animationSkipInput" type="number" value="1" min="1" onchange="updateAnimationSkip(this.value)">
    <label for="maxWaitInput">Max wait:</label>
    <input id="maxWaitInput" type="number" value="0" min="0" onchange="updateMaxWait(this.value)">
    <label for="frameInput">Frame:</label>
    <input id="frameInput" type="number" value="0" min="0" onchange="showFrame(this.value)">
    <div>Step: <span id="currentStep">0</span></div>
    <div>Version 10</div>
    <br>
    <span id="denseNodesCount">0</span> boundary nodes&nbsp;&nbsp;
    <span id="surfacesCount">0</span> boundary surfaces&nbsp;&nbsp;
    <span id="nodesMode"></span> mode&nbsp;&nbsp;
    <span id="count"></span>&nbsp;&nbsp;
    <span id="skip"></span>&nbsp;&nbsp;
    <span id="loadedProgress"></span>
    <span id="animationProgress"></span>&nbsp;&nbsp;
    <span id="error"></span>

    <br><br>
    <div id="cameraControls">
        <h4>Camera Controls:</h4>
        <div>
            Position: 
            X: <input type="number" id="camPosX" step="0.1" style="width: 70px">
            Y: <input type="number" id="camPosY" step="0.1" style="width: 70px">
            Z: <input type="number" id="camPosZ" step="0.1" style="width: 70px">
            <button onclick="applyCameraPosition()" class="button">Apply</button>
        </div>
        <div>
            Target: 
            X: <input type="number" id="camTargetX" step="0.1" style="width: 70px">
            Y: <input type="number" id="camTargetY" step="0.1" style="width: 70px">
            Z: <input type="number" id="camTargetZ" step="0.1" style="width: 70px">
            <button onclick="applyCameraTarget()" class="button">Apply</button>
        </div>
        <div>
            Zoom: <input type="number" id="camZoom" step="0.1" style="width: 70px">
            <button onclick="applyCameraZoom()" class="button">Apply</button>
        </div>
        <!-- <div>Current Parameters:</div> -->
        <!-- <div id="cameraInfo" style="font-family: monospace; margin-top: 5px;"></div> -->
    </div>

    <div id="container"></div>

    <!-- <script src="https://unpkg.com/three@0.175.2/build/three.min.js"></script> -->
    <!-- <script src="https://unpkg.com/three@0.175.2/examples/js/controls/OrbitControls.js"></script> -->
    <!-- <script src="https://unpkg.com/three@0.139.2/examples/jsm/utils/BufferGeometryUtils.js"></script> -->

    <script type="importmap">
        {
          "imports": {
            "three": "https://cdnjs.cloudflare.com/ajax/libs/three.js/0.170.0/three.module.min.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
            "three-subdivide": "https://unpkg.com/three-subdivide/build/index.module.js"

          }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import * as BufferGeometryUtils from 'three/addons/utils/BufferGeometryUtils.js';
        import { LoopSubdivision } from 'https://unpkg.com/three-subdivide/build/index.module.js';


        window.onerror = (errorMsg, url, lineNumber) => {
            alert("Error occured: " + errorMsg);
            return false;
        }

        // ------------------------------------------------------------------

        var paused = false;
        var highlightNodes = false;
        var nodesMode = 0;
        var loadedProgress = 0;
        var animationFrameFloat = 0.0;
        var step = 0;
        var wait = 0;
        var showDense = true;
        var showReduced = false;
        
        // Set harmonious colors
        const meshColor = 0x4f83cc; // Blue for bunny
        const reducedColor = 0xf18f01;
        const obstacleColor = 0xeed9c4; // Light beige for obstacles
        const groundColor = 0xffffff; //obstacleColor; //
        
        var scene;
        var gRenderer;
        var gCamera;
        var gCameraControl;
        var gMouseDown = false;

        var meshes;
        var animationSkip;
        var maxWait;
        var animationCount;
        var simulationName;
        var listFile;
        var body;

        const output_path = './output';

        const fileLoader = new THREE.FileLoader();

        function animationFrame() {
            return totalStep; //parseInt(animationFrameFloat)
        }

        window.simulationSelected = async (selectedIndex) => {
            setRunButton(true);
            simulationName = simulationSelector.value;
            animationCount = listFile.steps[selectedIndex];
            
            // gCamera.position.set(0, 4, 4);
            // gCamera.up.set(0, 0, 1);
            // gCameraControl.reset();
            
            // Reset animation state
            step = 0;
            wait = 0;
            
            await loadDataAsync();
            setRunButton(false);
        }
        window.reload = () => {
            location.reload();
        }
        window.run = () => {
            setRunButton(!paused);
        }
        window.toggleHiglightNodes = async () => {
            highlightNodes = !highlightNodes;
            setHtml("nodesMode", nodesMode);
            await animationStepInnerAsync();
        }
        window.toggleNodes = async () => {
            nodesMode += 1;
            setHtml("nodesMode", nodesMode);
            await animationStepInnerAsync();
        }
        window.onShowDense = async () => {
            showDense = !showDense;
            setCheckbox("showDenseCheckbox", showDense);
            await animationStepInnerAsync();
        }
        window.onShowReduced = async () => {
            showReduced = !showReduced;
            setCheckbox("showReducedCheckbox", showReduced);
            await animationStepInnerAsync();
        }

        // Add this function to handle animationSkip changes
        window.updateAnimationSkip = async (newSkip) => {
            animationSkip = parseInt(newSkip);
            setHtml("skip", `${animationSkip} skip`);
            await reloadMeshesAsync(); // Reload meshes with the new skip value
        };

        window.updateMaxWait = async (newSkip) => {
            maxWait = parseInt(newSkip);
        };

        window.showFrame = async (frameNumber) => {
            // Pause animation
            setRunButton(true);
            
            // Convert frame number to valid step
            frameNumber = parseInt(frameNumber);
            if (frameNumber < 0) frameNumber = 0;
            if (frameNumber > animationCount) frameNumber = animationCount;
            
            // Calculate closest available frame based on animation skip
            step = Math.round(frameNumber / animationSkip);
            
            // Update display
            setHtml("currentStep", step * animationSkip);
            document.getElementById("frameInput").value = step * animationSkip;
            
            // Show the frame
            await animationStepInnerAsync();
        };

        window.applyCameraPosition = () => {
            const x = parseFloat(document.getElementById('camPosX').value);
            const y = parseFloat(document.getElementById('camPosY').value);
            const z = parseFloat(document.getElementById('camPosZ').value);
            gCamera.position.set(x, y, z);
            gCamera.updateProjectionMatrix();
            updateCameraInfo();
        };

        window.applyCameraTarget = () => {
            const x = parseFloat(document.getElementById('camTargetX').value);
            const y = parseFloat(document.getElementById('camTargetY').value);
            const z = parseFloat(document.getElementById('camTargetZ').value);
            gCameraControl.target.set(x, y, z);
            gCameraControl.update();
            updateCameraInfo();
        };

        window.applyCameraZoom = () => {
            const zoom = parseFloat(document.getElementById('camZoom').value);
            gCamera.zoom = zoom;
            gCamera.updateProjectionMatrix();
            updateCameraInfo();
        };

        function updateCameraInfo() {
            const pos = gCamera.position;
            const target = gCameraControl.target;
            const info = `Position: (${pos.x.toFixed(2)}, ${pos.y.toFixed(2)}, ${pos.z.toFixed(2)})\n` +
                         `Target: (${target.x.toFixed(2)}, ${target.y.toFixed(2)}, ${target.z.toFixed(2)})\n` +
                         `Zoom: ${gCamera.zoom.toFixed(2)}`;
            // document.getElementById('cameraInfo').innerHTML = info.replace(/\n/g, '<br>');

            // Update input fields
            document.getElementById('camPosX').value = pos.x.toFixed(2);
            document.getElementById('camPosY').value = pos.y.toFixed(2);
            document.getElementById('camPosZ').value = pos.z.toFixed(2);
            document.getElementById('camTargetX').value = target.x.toFixed(2);
            document.getElementById('camTargetY').value = target.y.toFixed(2);
            document.getElementById('camTargetZ').value = target.z.toFixed(2);
            document.getElementById('camZoom').value = gCamera.zoom.toFixed(2);
        }

        function setHtml(label, value) {
            document.getElementById(label).innerHTML = value;
        }
        function setCheckbox(label, value) {
            document.getElementById(label).checked = value;
        }

        function setRunButton(new_paused) {
            paused = new_paused;
            var button = document.getElementById('buttonRun');
            if (paused)
                button.innerHTML = "Play";
            else
                button.innerHTML = "Pause";
        }

        function onWindowResize() {
            gCamera.aspect = window.innerWidth / window.innerHeight;
            gCamera.updateProjectionMatrix();
            gRenderer.setSize(window.innerWidth, window.innerHeight);
        }

        async function loadFileAsync(filePath, i = 0, animationCount = 1) {
            var fileContent = await fileLoader.setResponseType('json').loadAsync(
                filePath,
                function (xhr) {
                    loadedProgress = parseInt(((i + 1) / animationCount) * 100); // + xhr.loaded / xhr.total
                    setHtml("loadedProgress", `${loadedProgress}% loaded`);
                },
                function (err) {
                    document.getElementById("error").innerHTML = 'Error loading meshes';
                }
            );
            return fileContent;
        }

        // ------------------------------------------------------------------
        class Body {

            getNodes(mesh) {
                nodesMode = nodesMode % mesh.nodes_list.length;
                setHtml("nodesMode", nodesMode);
                var nodes = mesh.nodes_list[nodesMode];
                return nodes;
            }

            getNodesReduced(mesh) {
                return mesh.nodes_reduced_list[nodesMode];
            }

            getHighlightedNodes(mesh) {
                return mesh.highlighted_nodes_list[nodesMode];
            }

            constructor(initialMesh) {
                // physics
                var nodes = this.getNodes(initialMesh);
                var nodesReduced = this.getNodesReduced(initialMesh);
                var boundary_surfaces = initialMesh.boundary_surfaces

                this.denseNodesCount = nodes.length / 3;
                this.surfacesCount = boundary_surfaces.length / 3;
                this.denseNodes = new Float32Array(nodes);

                // surface tri mesh
                var geometry = new THREE.BufferGeometry();
                geometry.setAttribute('position', new THREE.BufferAttribute(this.denseNodes, 3));
                geometry.setIndex(boundary_surfaces);
                // geometry = geometry.toNonIndexed();

                geometry.computeVertexNormals();
                // geometry.computeBoundingBox();
                // geometry.computeBoundingSphere();
                // const helper = new THREE.VertexNormalsHelper(geometry, 0.1, 0x00ff00, 1);
                // scene.add(helper);

                var material = new THREE.MeshStandardMaterial({ color: meshColor, side: THREE.DoubleSide}); //, shadowSide: THREE.DoubleSide});
                
                material.flatShading = true;
                this.denseMesh = new THREE.Mesh(geometry, material);
                this.denseMesh.name = "surfaceMesh";
                this.denseMesh.userData = this;
                // this.denseMesh.layers.enable(1);
                // this.denseMesh.geometry = BufferGeometryUtils.mergeVertices(this.denseMesh.geometry);
                // geometry = geometry.toNonIndexed();
                this.denseMesh.visible = showDense;
                this.denseMesh.castShadow = true;
                this.denseMesh.receiveShadow = true;

                if (nodesReduced == undefined) {
                    this.sparseNodes = null;
                    this.sparseMesh = null;
                }
                else {
                    this.sparseNodes = new Float32Array(nodesReduced);

                    var geometry = new THREE.BufferGeometry();
                    geometry.setAttribute('position', new THREE.BufferAttribute(this.sparseNodes, 3));
                    geometry.setIndex(initialMesh.boundary_edges_reduced);

                    var material = new THREE.LineBasicMaterial({ color: reducedColor, linewidth: 2 });
                    this.sparseMesh = new THREE.LineSegments(geometry, material);
                    this.sparseMesh.name = "sparseMesh";

                    // var material = new THREE.MeshPhongMaterial({ color: 0xff00ff, side: THREE.DoubleSide });
                    // material.flatShading = true;
                    // this.tetMesh = new THREE.Mesh(geometry, material);
                    this.sparseMesh.visible = showReduced;
                    // console.log(JSON.stringify(tetMesh.verts));
                }
            }

            updateMesh(mesh) {
                var nodes = this.getNodes(mesh);
                var nodes_reduced = this.getNodesReduced(mesh);

                for (var i = 0; i < this.denseNodes.length; i++)
                    this.denseNodes[i] = nodes[i];
                // this.surfaceMesh.geometry.computeVertexNormals();
                this.denseMesh.geometry.attributes.position.needsUpdate = true;
                // this.surfaceMesh.geometry.computeBoundingSphere();
                this.denseMesh.visible = showDense;

                if (this.sparseNodes) {
                    for (var i = 0; i < this.sparseNodes.length; i++)
                        this.sparseNodes[i] = nodes_reduced[i];
                    this.sparseMesh.geometry.attributes.position.needsUpdate = true;

                    this.sparseMesh.visible = showReduced;
                }

            }

            addToScene(scene) {
                scene.remove(scene.getObjectByName("surfaceMesh"));
                scene.remove(scene.getObjectByName("sparseMesh"));

                scene.add(this.denseMesh);
                if (this.sparseMesh != null) {
                    scene.add(this.sparseMesh);
                }
            }
        }


        function addObstacle(scene, mesh) {
            var obs = mesh.linear_obstacles;
            const dir = new THREE.Vector3(obs[0], obs[1], obs[2]);
            dir.normalize();
            const origin = new THREE.Vector3(obs[3], obs[4], obs[5]);

            var length = 0.5;
            var arrowHelper = new THREE.ArrowHelper(dir, origin, length, 0xff0000);

            scene.remove(scene.getObjectByName("arrowHelper"));
            scene.remove(scene.getObjectByName("ground"));
            scene.remove(scene.getObjectByName("obstaclePlane"));
            // Remove all mesh obstacles with dynamic names
            let s = 0;
            while (true) {
                const obstacleMesh = scene.getObjectByName(`obstacleMesh${s}`);
                if (!obstacleMesh) break;
                scene.remove(obstacleMesh);
                s++;
            }

            // Add arrow helper
            arrowHelper.name = "arrowHelper";
            // scene.add(arrowHelper);

            // Create an obstacle plane perpendicular to the arrow
            const planeSize = 20;
            const planeGeometry = new THREE.PlaneGeometry(planeSize, planeSize);
            const planeMaterial = new THREE.MeshStandardMaterial({ 
                color: obstacleColor,
                transparent: true,
                opacity: 0.5,
                side: THREE.DoubleSide
            });
            const obstaclePlane = new THREE.Mesh(planeGeometry, planeMaterial);
            
            // Position the plane at the arrow's origin
            obstaclePlane.position.copy(origin);
            
            // Orient the plane to be perpendicular to the arrow
            // Create a rotation matrix that aligns the plane's normal with the arrow direction
            const normalMatrix = new THREE.Matrix4();
            const up = new THREE.Vector3(0, 1, 0);
            if (Math.abs(dir.dot(up)) === 1) {
                up.set(1, 0, 0); // Use x-axis as up vector if arrow is vertical
            }
            normalMatrix.lookAt(new THREE.Vector3(), dir, up);
            obstaclePlane.setRotationFromMatrix(normalMatrix);
            
            obstaclePlane.name = "obstaclePlane";
            scene.add(obstaclePlane);

            // Create ground plane with a solid beige color
            const groundGeometry = new THREE.PlaneGeometry(10000, 10000); // Effectively infinite ground
            const groundMaterial = new THREE.MeshStandardMaterial({
                color: groundColor,
                side: THREE.DoubleSide,
            });
            const ground = new THREE.Mesh(groundGeometry, groundMaterial);
            ground.position.z = -7;
            ground.receiveShadow = true;
            ground.name = "ground";
            // scene.add(ground);

            if (mesh.mesh_obstacles_nodes != undefined) {
                for (var i = 0; i < mesh.mesh_obstacles_nodes.length; i += 1) {
                    var obstacle_nodes = new Float32Array(mesh.mesh_obstacles_nodes[i]);
                    var obstacle_boundary_surfaces = mesh.mesh_obstacles_boundary_surfaces[i];

                    var geometry = new THREE.BufferGeometry();
                    geometry.setAttribute('position', new THREE.BufferAttribute(obstacle_nodes, 3));
                    geometry.setIndex(obstacle_boundary_surfaces);       
                    const iterations = 1;

                    const params = {
                        split:          true,
                        uvSmooth:       false,
                        preserveEdges:  true,
                        flatOnly:       true,
                        maxTriangles:   Infinity,
                    };
                    geometry = LoopSubdivision.modify(geometry, iterations, params);

                    geometry.computeVertexNormals();
                    var material = new THREE.MeshStandardMaterial({ color: obstacleColor, side: THREE.DoubleSide });
                    material.flatShading = true;
                    var obstacleMesh = new THREE.Mesh(geometry, material);
                    obstacleMesh.name = `obstacleMesh${i}`;
                    obstacleMesh.userData = this;
                    obstacleMesh.visible = showDense;
                    obstacleMesh.castShadow = true;
                    obstacleMesh.receiveShadow = true;
                    scene.add(obstacleMesh);
                }
            }
        }


        // ------------------------------------------

        function initThreeScene() {
            scene = new THREE.Scene();

            // Set beige background
            scene.background = new THREE.Color(groundColor); // Beige

            // scene.add(new THREE.AxesHelper(0.2));
            
            // Lights
            var rectLight = new THREE.RectAreaLight(0xffffff, 1, 10, 10);
            rectLight.position.set(0, 0, 4);
            rectLight.lookAt(0, 0, 0);
            scene.add(rectLight);
            scene.add(new THREE.AmbientLight(0xffffff, 2.0));
            // scene.fog = new THREE.Fog(0x000000, 0, 15);

            // var topLight2 = new THREE.DirectionalLight(0xffffff, 3.0);
            // topLight2.position.set(0, 1, 4);
            // topLight2.target.position.set(0, 0, 0);
            // topLight2.castShadow = true;

            // topLight2.shadow.mapSize.width = 2048;  // Default is often 512
            // topLight2.shadow.mapSize.height = 2048;
            // topLight2.shadow.bias = -0.0001; // Try different values

            // scene.add(topLight2);


            // var topLight = new THREE.HemisphereLight( 0xffffff, 0xffffff, 1.0)
            var topLight = new THREE.DirectionalLight(0xffffff, 1.0);
            // var topLight = new THREE.PointLight(0xffffff, 0.8, 100);
            topLight.position.set(0, -1, 40);
            topLight.target.position.set(0, 0, 0);
            topLight.castShadow = true;

            // Adjust your existing code
            topLight.shadow.mapSize.width = 4096;  // Higher resolution for softer edges
            topLight.shadow.mapSize.height = 4096;
            topLight.shadow.bias = -0.0001;
            topLight.shadow.radius = 8; // Increase radius for softer shadow edges
            topLight.shadow.blurSamples = 16; // For THREE >= 0.152.0

            // topLight.shadow.bias = 0.001; // Try different values
            // topLight.shadow.normalBias = 0.05; // Add normal bias
            // topLight.shadow.radius = 4;

            // Add these configurations
            // topLight.shadow.camera.near = 0.5;
            // topLight.shadow.camera.far = 50;
            // topLight.shadow.camera.left = -10;
            // topLight.shadow.camera.right = 10;
            // topLight.shadow.camera.top = 10;
            // topLight.shadow.camera.bottom = -10;

            scene.add(topLight);
            // scene.add(new THREE.DirectionalLightHelper(topLight, 0.1));
            // scene.add(new THREE.CameraHelper(topLight.shadow.camera));

            // var bottomLight = new THREE.DirectionalLight(0xffffff, 0.4);
            // bottomLight.position.set(0, 0, -5);
            // bottomLight.target.position.set(0, 0, 0);
            // scene.add(bottomLight);
            // scene.add(new THREE.DirectionalLightHelper(bottomLight, 0.1));

            // Lights
            // const ambientLight = new THREE.AmbientLight(0xffffff, 0.3); // Reduced ambient light
            // scene.add(ambientLight);

            // Main directional light (sun-like)
            // const mainLight = new THREE.DirectionalLight(0xffffff, 0.8);
            // mainLight.position.set(2, 4, 3);
            // mainLight.castShadow = true;
            // mainLight.shadow.mapSize.width = 2048;
            // mainLight.shadow.mapSize.height = 2048;
            // mainLight.shadow.camera.near = 0.1;
            // mainLight.shadow.camera.far = 20;
            // mainLight.shadow.camera.left = -5;
            // mainLight.shadow.camera.right = 5;
            // mainLight.shadow.camera.top = 5;
            // mainLight.shadow.camera.bottom = -5;
            // scene.add(mainLight);

            // Soft fill light
            // const fillLight = new THREE.DirectionalLight(0xffffff, 0.2);
            // fillLight.position.set(-2, 2, -1);
            // scene.add(fillLight);

            // Geometry
            var helper = new THREE.GridHelper(20, 20);
            helper.material.opacity = 1.0;
            helper.material.transparent = true;
            helper.position.set(0, 0.002, 0);
            // gThreeScene.add(helper);

            // Renderer

            gRenderer = new THREE.WebGLRenderer({ antialias: true });
            gRenderer.shadowMap.enabled = true;
            gRenderer.shadowMap.type = THREE.PCFSoftShadowMap;
            // gRenderer.shadowMapCullFace = THREE.CullFaceFrontBack;
            // gRenderer.shadowMap.type = THREE.VSMShadowMap;

            gRenderer.setPixelRatio(window.devicePixelRatio);
            gRenderer.setSize(0.8 * window.innerWidth, 0.8 * window.innerHeight);
            // gRenderer.outputEncoding = THREE.sRGBEncoding;
            window.addEventListener('resize', onWindowResize, false);
            container.appendChild(gRenderer.domElement);

            // Camera

            gCamera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 100);
            gCamera.position.set(0, 4, 4);
            gCamera.updateMatrixWorld();
            gCamera.up.set(0, 0, 1);

            scene.add(gCamera);

            gCameraControl = new OrbitControls(gCamera, gRenderer.domElement);
            gCameraControl.zoomSpeed = 0.5;
            gCameraControl.panSpeed = 0.4;
            gCameraControl.addEventListener('change', updateCameraInfo);

            // Initialize camera info display
            updateCameraInfo();
        }


        async function reloadMeshesAsync() {
            const meshPromises = [];
            meshes = [];

            for (let i = 0; i <= animationCount; i += animationSkip) {
                meshPromises.push(loadFileAsync(`${simulationName}/${i}.json`, i, animationCount));
            }

            meshes = await Promise.all(meshPromises);

            document.getElementById("loadedProgress").innerHTML = '';
            setHtml("count", `${animationCount} count`);
            setHtml("skip", `${animationSkip} skip`);
        }

        async function initMeshAsync() {

            var mesh = meshes[0]
            body = new Body(mesh);
            body.addToScene(scene);
            addObstacle(scene, mesh);

            setHtml("denseNodesCount", body.denseNodesCount);
            setHtml("surfacesCount", body.surfacesCount);
        }

        async function runAnimationAsync() {
            // if (stop)
            //     return;
            await animationStepAsync();
            gRenderer.render(scene, gCamera);
            requestAnimationFrame(runAnimationAsync);

        }

        async function animationStepAsync() {
            if (paused) return;
            
            wait += 1;
            if (wait < maxWait) return;
            wait = 0;

            step += 1;
            if (step * animationSkip > animationCount) step = 0;

            animationStepInnerAsync();
        }

        async function animationStepInnerAsync() {
            setHtml("currentStep", step * animationSkip);// * animationSkip);
        
            var mesh = meshes[step];
            if (mesh){
                body.updateMesh(mesh);

                if (highlightNodes)
                    rehighlightNodes(body.getHighlightedNodes(mesh));
                else
                    clearHighlightNodes();
            }
        }

        function clearHighlightNodes() {
            var oldBallMesh = scene.getObjectByName("ballMesh");
            if (oldBallMesh !== undefined) {
                for (var child in oldBallMesh.children) {
                    scene.remove(child);
                }
                scene.remove(oldBallMesh);
            }
        }

        function rehighlightNodes(nodes) {
            var radius = 0.015;
            var segments = 8;
            var nodesCount = nodes.length / 3;

            clearHighlightNodes();

            if (nodes.length == 0)
                return;

            var ballMesh = new THREE.Object3D();
            ballMesh.name = "ballMesh";
            for (var i = 0; i < nodesCount; i++) {
                var pos = new THREE.Vector3(nodes[3 * i], nodes[3 * i + 1], nodes[3 * i + 2]);

                var geometry = new THREE.SphereGeometry(radius, segments, segments);
                var material = new THREE.MeshPhongMaterial({ color: 0xff0000 });
                var ball = new THREE.Mesh(geometry, material); // THREE.InstancedMesh( geometry, material, this.numBalls )
                ball.position.copy(pos);

                ballMesh.add(ball);
                // ball.geometry.attributes.position.needsUpdate = true;
            }
            scene.add(ballMesh);
        }

        async function loadDataAsync() {
            await reloadMeshesAsync();
            await initMeshAsync();
            await runAnimationAsync();
        }

        async function initializeApplication() {
            // Initialize default values
            paused = false;
            highlightNodes = false;
            nodesMode = 0;
            loadedProgress = 0;
            animationFrameFloat = 0.0;
            step = 0;
            wait = 0;
            showDense = true;
            showReduced = false;
            animationSkip = 20;
            maxWait = 10;


            // Set initial UI state
            setCheckbox("showDenseCheckbox", showDense);
            setCheckbox("showReducedCheckbox", showReduced);
            setRunButton(false);
            setHtml("nodesMode", nodesMode);
            document.getElementById('animationSkipInput').value = animationSkip;
            document.getElementById('maxWaitInput').value = maxWait;
            document.getElementById('frameInput').value = 0;  // Initialize frame input
            
            // Initialize simulation selector
            var simulationSelector = document.getElementById('simulationSelector');
            listFile = await loadFileAsync(`${output_path}/three_list.json`);

            simulationName = listFile.simulations[0];
            animationCount = listFile.steps[0];

            // Populate simulation selector
            for (const simulationName of listFile.simulations) {
                var opt = document.createElement('option');
                opt.value = simulationName;
                opt.innerHTML = simulationName;
                simulationSelector.appendChild(opt);
            }

            window.updateAnimationSkip(animationSkip);

            // Initialize Three.js scene
            initThreeScene();
            onWindowResize();
            // await loadDataAsync();
            // await runAnimationAsync();

            // Select first scenario
            if (simulationSelector.options.length > 0) {
                simulationSelected(0);
            }
        }

        // Start the application
        initializeApplication();

    </script>
</body>

</html>
